name: Actions housekeeping

on:
  schedule:
    - cron: "17 3 * * 1"      # Mondays 03:17 UTC (avoid the top of the hour)
  workflow_dispatch:
    inputs:
      apply:
        description: Really delete old artifacts?
        type: boolean
        default: false

permissions:
  actions: write      # list runs and delete artifacts
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Report and clean up
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: python scripts/gh_report.py --days 7 --cleanup-older-than 14 $APPLY
